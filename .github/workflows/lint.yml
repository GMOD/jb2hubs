name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install

      # Runs `astro sync` first (website/.astro/types.d.ts is in the root
      # tsconfig's include).
      - name: TypeScript type check
        run: pnpm typecheck

      # Untyped pass first: it is seconds, so a plain syntactic mistake reports
      # before the type-aware pass spends time building programs.
      - name: Lint (oxlint)
        run: pnpm lint:fast

      - name: Type-aware lint (oxlint + tsgolint)
        run: pnpm lint

      - name: Format check (oxfmt + prettier for .astro)
        run: pnpm check-format

      - name: Install shfmt
        run: |
          curl -sSL "https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: ShellCheck
        run: pnpm lint:sh

      # Seconds, no browser, and the failure it catches error-pages every config
      # that names the url. The full boot matrix needs Chrome and minutes, so it
      # runs in config-canary.yml on a timer instead.
      - name: Plugin urls
        run: pnpm check-plugin-urls

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install

      - name: TypeScript tests
        run: pnpm --recursive --if-present run test

      # parallel is for ucsc2jbrowse/common.test.sh's run_for_assemblies cases;
      # the runner image does not promise GNU parallel.
      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y xxhash pigz parallel

      # Every suite runs, and the step fails afterwards if any did. A plain list
      # under `bash -e` stops at the first failure, and lib/common.test.sh had
      # been failing since it started asserting that this host's bgzip matches
      # BGZIP_TOOLCHAIN_SIGNATURE -- a runner with no bgzip at all cannot -- so
      # the two suites after it had never run in CI. One red suite must not hide
      # the others.
      #
      # ucsc2jbrowse/common.test.sh is new to this list for a duller reason: it
      # was written and never wired in, so the gates it pins (is_assembly_db,
      # prune_stray_configs' refusals) were only ever checked by hand.
      - name: Shell tests
        run: |
          status=0
          for suite in \
            ./lib/common.test.sh \
            ./lib/chainpif.test.sh \
            ./ucsc2jbrowse/common.test.sh \
            ./genark2jbrowse/addNcbiGffAndTextIndex.test.sh; do
            echo "==> $suite"
            "$suite" || status=1
          done
          exit $status
