packages:
  - website
  - ucsc2jbrowse
  - genark2jbrowse
  - 'aws/*'
  - hubtools
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@jbrowse/add-track-core@5.0.0-beta.20'
  - '@jbrowse/cigar-utils@5.0.0-beta.20'
  - '@jbrowse/cli@5.0.0-beta.20'
  - '@jbrowse/launch-args@5.0.0-beta.20'
  - '@jbrowse/text-indexing-core@5.0.0-beta.20'
  - p2s_mapper@2.0.0 || 2.4.0
  - '@jbrowse/bandage-core'
  - '@jbrowse/graph-walks'
  - '@gmod/tabix@3.13.1'
overrides:
  '@jbrowse/cli@5.0.0-beta.20>@jbrowse/text-indexing-core': 5.0.0-beta.20
