packages:
  - website
  - ucsc2jbrowse
  - genark2jbrowse
  - 'aws/*'
  - hubtools
overrides:
  # This site and react-msaview 8.x are a major version ahead of the newest
  # PUBLISHED @jbrowse/core (4.3.0) on both of its UI stacks: MUI 9 vs 7, and
  # mobx 7 / MST 6 vs mobx 6 / MST 5. Left alone, both copies of each land in the
  # page and the alignment viewer does not render at all — MobX says "multiple,
  # different versions of MobX active", MST then refuses to build the viewer's
  # model, and separately a MUI 7 theme handed to MUI 9's ThemeProvider takes the
  # whole view down through react-msaview's error boundary
  # ("Cannot read properties of undefined (reading 'length')").
  #
  # So hoist core onto what everything else already uses. Measured in a browser
  # on 2026-08-26: with these four, the 100-way alignment draws with zero console
  # errors; with the mobx pair alone it still dies on the MUI theme.
  mobx: ^7.0.3
  '@jbrowse/mobx-state-tree': ^6.5.1
  '@mui/material': ^9.4.0
  '@mui/icons-material': ^9.4.0
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@jbrowse/add-track-core@5.0.0-beta.2 || 5.0.0-beta.7'
  - '@jbrowse/cigar-utils@5.0.0-beta.2 || 5.0.0-beta.7'
  - '@jbrowse/cli@5.0.0-beta.2 || 5.0.0-beta.7'
  - '@jbrowse/text-indexing-core@5.0.0-beta.2 || 5.0.0-beta.7'
  - p2s_mapper@1.2.0
patchedDependencies:
  '@jbrowse/core@4.3.0': patches/@jbrowse__core@4.3.0.patch
